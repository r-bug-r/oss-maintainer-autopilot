[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oss-maintainer-autopilot"
version = "0.1.0"
description = "Approval-gated maintainer automation for GitHub and GitLab repositories"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "OSS Maintainer Autopilot contributors" }]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
autopilot = "autopilot.cli:main"

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.14.2",
  "mypy==1.18.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autopilot = ["prompts/*.txt", "ui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
  "live: opt-in tests that would call a real provider or GitHub API",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]
# Smoke script: fixed non-credential fixture secret, localhost-only HTTP, and a
# fixed interpreter invocation with no user-controlled argv.
"scripts/**" = ["S101", "S105", "S310", "S603"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests", "scripts"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
