name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]" pip-audit
      - name: Dependency audit
        run: python -m pip_audit --skip-editable
      - name: Secret scan
        run: python scripts/scan_secrets.py
      - name: Static security lint
        run: python -m ruff check src scripts --select S --ignore S101
